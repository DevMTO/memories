# nginx en el VPS (alternativa al Caddyfile): sirve el editor (/admin y la vista
# previa) y hace de proxy a PocketBase. Va en /etc/nginx/conf.d/memories.conf; HTTPS lo
# agrega `certbot --nginx` sobre ese archivo (ver "HTTPS" en kit/deploy/vps.md). Los
# visitantes ven el sitio público (memoriestravelperu.com); aquí solo está la vista previa,
# fuera de los buscadores.

# editor.<dominio> sirve solo la vista previa (kit/deploy/build.sh la rearma después
# de cada publicación) y solo a quien tenga la cookie que pone /admin mientras la
# sesión es válida. Sin ella, solo /admin (el login) y sus archivos; lo demás
# redirige a /admin/. CLAVE = PREVIEW_KEY de pocketbase.env (obligatoria).
# La clave (64 caracteres) no entra en la tabla por defecto de los map de nginx.
# Va una sola vez en todo nginx y antes del primer `map` que lea (si no, nginx -t:
# "map_hash_bucket_size directive is duplicate"). Con un solo sitio, aquí. Si
# nginx.conf ya tiene un map (p. ej. $connection_upgrade) o hay varios sitios en el
# VPS, va en el bloque http de nginx.conf, antes de ese map y de los include, y se
# borra de aquí.
map_hash_bucket_size 128;

map $cookie_site_preview $memories_editor {
  "CLAVE" 1;
  default 0;
}

server {
  listen 80;
  server_name editor.memoriestravelperu.com;
  root /srv/memories/preview;
  index index.html;

  # Todo lo que sale de aquí es tráfico de salida de la VM: comprimido. El HTML
  # (text/html) nginx lo comprime siempre con gzip on; ponerlo aquí da "duplicate
  # MIME type".
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Archivos con hash en el nombre: nunca cambian. Sin cookie también (los usa el
  # login de /admin; los nombres no se adivinan).
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  # El login: siempre.
  location = /admin {
    return 301 /admin/;
  }
  location /admin/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri $uri/ =404;
  }

  # La vista previa: solo con la cookie. HTML y demás se revalidan siempre.
  location / {
    if ($memories_editor = 0) {
      return 302 /admin/;
    }
    add_header Cache-Control "no-cache";
    add_header Vary Cookie;
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri $uri/ =404;
  }
}

server {
  listen 80;
  server_name pb.memoriestravelperu.com;

  # Imágenes y copias de seguridad (zip entero) subidas desde /admin o el dashboard.
  # PocketBase pone sus propios límites por ruta (imágenes 5 MB, el resto 32 MB; las
  # copias, hasta 1 GB: kit/pocketbase/core/hooks/backups.pb.js).
  client_max_body_size 1g;

  # API, archivos y el panel de PocketBase (/_/): fuera de los buscadores, también
  # en las respuestas de error.
  add_header X-Robots-Tag "noindex, nofollow" always;

  location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # PocketBase toma la IP del visitante del final de X-Forwarded-For
    # (kit/pocketbase/core/migrations/1700000002_kit_app_settings.js).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime (SSE) de /admin: sin buffer y conexiones largas.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 360s;
  }
}
