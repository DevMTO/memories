# nginx en el VPS (alternativa al Caddyfile): sirve el sitio para el editor
# (/admin y la vista previa) y hace de proxy a PocketBase. Copiar a
# /etc/nginx/conf.d/memories.conf y cambiar los dominios; HTTPS lo agrega
# `certbot --nginx` sobre este archivo. Los visitantes ven el sitio en Cloudflare
# Pages o en el hosting con cPanel (example.com); aquí es una copia para el
# editor, fuera de los buscadores.

# Vista previa del editor (kit/deploy/build.sh): las mismas URLs, servidas desde otra
# carpeta a quien tenga la cookie que pone /admin. CLAVE = PREVIEW_KEY de
# pocketbase.env. Sin vista previa, dejar solo la línea default.
# La clave (64 caracteres) no entra en la tabla por defecto de los map de nginx.
# Va una sola vez en todo nginx y antes del primer `map` que lea (si no, nginx -t:
# "map_hash_bucket_size directive is duplicate"). Con un solo sitio, aquí. Si
# nginx.conf ya tiene un map (p. ej. $connection_upgrade) o hay varios sitios en el
# VPS, va en el bloque http de nginx.conf, antes de ese map y de los include, y se
# borra de aquí.
map_hash_bucket_size 128;

map $cookie_site_preview $memories_root {
  "CLAVE" /srv/memories/preview;
  default /srv/memories/site;
}

server {
  listen 80;
  server_name editor.example.com;
  root $memories_root;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Archivos con hash en el nombre: nunca cambian.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  # HTML y demás: siempre se revalida para ver el contenido recién publicado.
  location / {
    add_header Cache-Control "no-cache";
    add_header Vary Cookie;
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri $uri/ =404;
  }
}

server {
  listen 80;
  server_name pb.example.com;

  # Imágenes subidas desde /admin.
  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # PocketBase toma la IP del visitante del final de X-Forwarded-For
    # (kit/pocketbase/core/migrations/1700000002_kit_app_settings.js).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime (SSE) de /admin: sin buffer y conexiones largas.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 360s;
  }
}
